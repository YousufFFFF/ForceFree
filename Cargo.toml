[package]
name = "forcefree"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Find, rank and reclaim the disk space your dev projects are quietly eating."
license = "MIT"
repository = "https://github.com/YousufFFFF/ForceFree"
readme = "README.md"
keywords = ["disk", "cleanup", "node-modules", "developer-tools", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
jwalk = "0.8"
anyhow = "1"

# Carries recognised project roots off the walker threads. Already compiled here
# via jwalk -> crossbeam, so this is a direct edge and no new crate. Its Sender
# is Sync, which jwalk's process_read_dir closure requires; std's mpsc is not.
crossbeam-channel = "0.5"

# Terminal colour. All three are already compiled in this tree via clap ->
# anstream, so these are direct edges rather than new crates. anstream decides
# whether colour is emitted at all (NO_COLOR, CLICOLOR, TTY detection, Windows
# virtual-terminal mode); anstyle-query answers whether truecolour is available,
# which anstream does not; anstyle carries the styles themselves.
anstream = "1"
anstyle = "1"
anstyle-query = "1"
crossterm = "0.28"

# Hard link counts and file identity. std exposes both on Unix via MetadataExt,
# but on Windows `number_of_links` and `file_index` are still unstable
# (rust#63010), so we call GetFileInformationByHandle directly. windows-sys is
# already compiled in this tree via clap -> anstream -> anstyle-wincon, so this
# adds a direct edge and no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",          # CreateFileW takes SECURITY_ATTRIBUTES
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# Test-only. The git safety tests need throwaway repositories that clean
# themselves up; the previous fixed path under temp_dir() collided whenever two
# test runs overlapped. Does not ship in the binary and does not affect the
# MSRV consumers see.
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
